name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test server
        run: mvn -B -pl auction-server -am package

      - name: Compile client
        run: mvn -B -pl auction-client -am compile -DskipTests

      - name: Upload server fat-jar
        uses: actions/upload-artifact@v4
        with:
          name: auction-server-fat-jar
          path: auction-server/target/*-fat.jar
          if-no-files-found: error

      - name: Test summary
        if: always() && hashFiles('**/target/surefire-reports/*.xml') != ''
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
